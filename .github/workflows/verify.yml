name: Verify
run-name: ${{ inputs.release_only && 'Verify (Release-only diagnostics)' || 'Verify (full)' }}

on:
  workflow_dispatch:
    inputs:
      release_only:
        description: 'Release-only diagnostics; omit static analysis and ASan'
        required: false
        type: boolean
        default: false
      baseline_sha:
        description: 'Full baseline commit SHA for the Release layout report (default: first parent)'
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only successive updates to the same PR share a group.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Release x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: sources
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned MSVC toolchain
        shell: powershell
        run: .\scripts\prepare-ci-toolchain.ps1
      - name: Verify source and Release x64
        id: release_check
        shell: powershell
        run: .\scripts\ci.ps1 ${{ github.event_name == 'workflow_dispatch' && inputs.release_only && '-ReleaseOnly' || '-Worker Release' }}
      - name: Report Release layout changes
        id: layout_report
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: powershell
        env:
          WAVPLAY_RELEASE_OUTCOME: ${{ steps.release_check.outcome }}
        run: .\scripts\ci-release-layout.ps1
      - name: Record interrupted Release layout report
        if: ${{ always() && steps.sources.outcome == 'success' && steps.layout_report.outcome != 'skipped' && steps.layout_report.outputs.summary_written != 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        shell: powershell
        env:
          INTERRUPTED_SUMMARY: |
            ## Release 配置差分

            比較失敗（要約の出力前に中断）
        run: |
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $env:INTERRUPTED_SUMMARY, [Text.UTF8Encoding]::new($false))
          Write-Output 'Release layout summary: failed'

  debug:
    name: Debug and AddressSanitizer x64
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_only }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare pinned MSVC and AddressSanitizer toolchain
        shell: powershell
        run: .\scripts\prepare-ci-toolchain.ps1 -IncludeASan
      - name: Verify Debug and Debug-ASan x64
        shell: powershell
        run: .\scripts\ci.ps1 -Worker Debug

  verify:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_only && 'Release diagnostics' || 'Full verification' }}
    needs: [release, debug]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required job results
        shell: bash
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          DEBUG_RESULT: ${{ needs.debug.result }}
          EXPECTED_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_only && 'skipped' || 'success' }}
        run: |
          echo "Release=$RELEASE_RESULT, Debug/ASan=$DEBUG_RESULT"
          [[ "$RELEASE_RESULT" == success && "$DEBUG_RESULT" == "$EXPECTED_DEBUG" ]]

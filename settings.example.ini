; Copy this file beside wavplay.exe as settings.ini (UTF-8, optional BOM).
; Find installed x64 ASIO CLSIDs with scripts/check-asio-drivers.ps1.
; Use the same CLSID, including braces, for SelectedDevice and Device below.
; Device settings take effect on the next application launch.

[General]
; Empty, missing, or all-zero CLSID displays NO DEVICE.
SelectedDevice=

; Replace {ASIO-driver-CLSID} and uncomment this device section as needed.
; [Device.{ASIO-driver-CLSID}]
; Name=Device name
; OutputPair=1
; BufferSize=0
; StartSilence=100
;
; OutputPair: odd first channel number (1 = 1/2, 3 = 3/4, ...).
; BufferSize: 0 (or missing) uses the current driver preference for the active
; sample rate when creating buffers; positive values are exact frame counts.
; The player does not restore the driver preference on exit or reinitialization.
; Drivers may retain the chosen size, affecting the buffer size and latency of
; later BufferSize=0 playback or applications using the same driver's preference.
; Callbacks per second = sample rate / BufferSize (44100 / 512 is about 86).
; For comparisons, set a positive BufferSize and change one variable at a time.
; StartSilence: 0..1000 milliseconds, rounded up to whole ASIO buffers.
; Name: optional Unicode display name; otherwise the CLSID is displayed.

; Window values are saved automatically on exit. Manual geometry needs all
; four values, in physical screen pixels, for the normal outer rectangle.
; Any known Window key requires all four geometry keys; Maximized alone fails.
; Maximized is optional (0 by default), and accepts only 0 or 1.
; [Window]
; X=100
; Y=100
; Width=900
; Height=600
; Maximized=0
